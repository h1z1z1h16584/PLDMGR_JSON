name: Generate Payloads

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

permissions:
  contents: write # Grants permission to commit and push changes back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # If generate.py uses packages like requests, ensure they are installed:
          pip install requests

      - name: Run payload generator
        run: python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update payloads.json" && git push)
